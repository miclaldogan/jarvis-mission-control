services:
  backend:
    build:
      context: ./backend
    depends_on:
      - redis
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
