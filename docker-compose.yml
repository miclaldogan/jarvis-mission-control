services:
  backend:
    build:
      context: ./backend
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    volumes:
      - jarvis-db:/data
    environment:
      - DATABASE_PATH=/data/jarvis_mission_control.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  frontend-dev:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=
      - VITE_DEV_PROXY_TARGET=http://backend:8000
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    command: sh -lc "npm ci --legacy-peer-deps --no-audit && npm run dev -- --host 0.0.0.0 --port 5173"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
  jarvis-db:
  client-node-modules:
