version: "3.9"

services:
  backend:
    build:
      context: ./backend
    depends_on:
      - redis
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.example

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
